apiVersion: v1
kind: Pod
metadata:
  labels:
    app: jenkins-agent

spec:
  serviceAccountName: jenkins

  containers:
  # 🔹 Node container (frontend build)
  - name: node
    image: node:18
    command:
      - cat
    tty: true
    workingDir: /home/jenkins/agent

  # 🔹 Docker container (image build)
  - name: docker
    image: docker:24-dind
    securityContext:
      privileged: true
    command:
      - dockerd-entrypoint.sh
    tty: true
    workingDir: /home/jenkins/agent
    volumeMounts:
      - name: docker-sock
        mountPath: /var/run/docker.sock

  # 🔹 Kubectl container (deployment)
  - name: kubectl
    image: bitnami/kubectl:latest
    command:
      - cat
    tty: true
    workingDir: /home/jenkins/agent

  # 🔹 Volumes (shared workspace + docker socket)
  volumes:
    - name: docker-sock
      hostPath:
        path: /var/run/docker.sock
